{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base page</title>
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  


</head>
<body>

  <header>
    <div class="logo">
      <a href="{% url 'home' %}"><h2>Kun.uz</h2></a>
    </div>

    <div class="register">
      
      {% if user.is_authenticated %}
      <div>
        <span>{{ user.username }}</span> |
      </div>
    
      <form action="{% url 'logout' %}" method="post">
        {% csrf_token %}
        <button type="submit" class="logout-btn">
          Logout
        </button>
      </form>
    {% else %}
      <a href="{% url 'login' %}" class="login-btn registerr">Login</a>
      <a href="{% url 'signup' %}" class="signup-btn registerr">Sign up</a>
    {% endif %}
    
    </div>
  </header>

  
  {% block content %}
  {% endblock content %}
    
</body>
</html>
